name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
